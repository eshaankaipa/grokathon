<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Resolved market OG image">
  <defs>
    <radialGradient id="glowL" cx="15%" cy="0%" r="55%">
      <stop offset="0%" stop-color="#1e3a5f" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1e3a5f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="95%" cy="10%" r="45%">
      <stop offset="0%" stop-color="#3b0764" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3b0764" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="yesWash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#052e16" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#141416" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#0a0a0b"/>
  <rect width="1200" height="630" fill="url(#glowL)"/>
  <rect width="1200" height="630" fill="url(#glowR)"/>

  <g transform="translate(64, 36)">
    <circle cx="16" cy="16" r="16" fill="#1d9bf0"/>
    <text x="16" y="21" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#fff">X</text>
    <text x="44" y="22" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="600" letter-spacing="1.5" fill="#a1a1aa">X PREDICTION MARKETS</text>
  </g>

  <g transform="translate(900, 32)">
    <rect width="236" height="40" rx="20" fill="#0c1a2e" stroke="#1e3a5f" stroke-width="1.5"/>
    <text x="118" y="26" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="700" letter-spacing="1" fill="#93c5fd">RESOLVED · YES</text>
  </g>

  <text x="64" y="150" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="48" font-weight="700" fill="#fafafa">
    <tspan x="64" dy="0">Will Grokathon ship markets</tspan>
    <tspan x="64" dy="58">today?</tspan>
  </text>
  <text x="64" y="280" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" fill="#a1a1aa">Outcome final · winning shares paid $1.00</text>

  <!-- YES winner -->
  <g transform="translate(64, 310)">
    <rect width="520" height="220" rx="20" fill="#141416" stroke="#22c55e" stroke-width="3"/>
    <rect width="520" height="220" rx="20" fill="url(#yesWash)"/>
    <rect x="0" y="0" width="8" height="220" rx="4" fill="#22c55e"/>
    <text x="36" y="48" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" font-weight="700" letter-spacing="2" fill="#22c55e">YES  ✓</text>
    <text x="36" y="130" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="64" font-weight="700" fill="#fafafa">$1.00</text>
    <rect x="36" y="156" width="448" height="12" rx="6" fill="#27272a"/>
    <rect x="36" y="156" width="448" height="12" rx="6" fill="#22c55e"/>
    <text x="36" y="198" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" fill="#86efac">Paid $1.00 per share</text>
  </g>

  <!-- NO loser -->
  <g transform="translate(616, 310)" opacity="0.45">
    <rect width="520" height="220" rx="20" fill="#141416" stroke="#27272a" stroke-width="1.5"/>
    <rect x="0" y="0" width="8" height="220" rx="4" fill="#ef4444"/>
    <text x="36" y="48" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" font-weight="700" letter-spacing="2" fill="#ef4444">NO</text>
