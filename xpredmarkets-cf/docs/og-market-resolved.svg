  <line x1="64" y1="560" x2="1136" y2="560" stroke="#27272a" stroke-width="1"/>
  <text x="64" y="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" fill="#71717a">xpred.aidenhuang.com</text>
  <text x="1136" y="600" text-anchor="end" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" fill="#71717a">Vol 65 · Binary</text>
